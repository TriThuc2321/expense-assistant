services:
  postgres:
    image: postgres:17-alpine
    container_name: expense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense
    # 5433 because 5432 is often taken by other local Postgres instances.
    ports:
      - '5433:5432'
    volumes:
      - expense-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d expense']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  expense-pgdata:
